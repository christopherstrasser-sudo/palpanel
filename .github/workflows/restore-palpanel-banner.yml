name: Restore local PalPanel banner

on:
  push:
    paths:
      - ".github/workflows/restore-palpanel-banner.yml"

permissions:
  contents: write

jobs:
  restore-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PNG-Banner wiederherstellen
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image

          url = "https://images.hdqwalls.com/wallpapers/palworld-n7.jpg"
          req = Request(url, headers={"User-Agent": "Mozilla/5.0 PalPanel-Banner-Restore"})
          with urlopen(req, timeout=30) as response:
              data = response.read()

          image = Image.open(BytesIO(data)).convert("RGB")
          image = image.resize((2048, 1152), Image.Resampling.LANCZOS)
          target = Path("public/palpanel-banner.png")
          target.parent.mkdir(parents=True, exist_ok=True)
          image.save(target, format="PNG", optimize=True)
          print(f"PNG geschrieben: {target} | {image.width}x{image.height} | {target.stat().st_size} Bytes")
          PY

      - name: PNG ins Repository schreiben
        shell: bash
        run: |
          git config user.name "PalPanel Banner Restore"
          git config user.email "actions@users.noreply.github.com"
          git add public/palpanel-banner.png
          if git diff --cached --quiet; then
            echo "Banner ist bereits identisch vorhanden."
            exit 0
          fi
          git commit -m "restore local PNG banner asset"
          git push
